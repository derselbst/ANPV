version: "3"

services:
  anpv-build:
    image: ghcr.io/derselbst/qt6.suse:master
    build:
      context: docker/

  anpv:
    image: ghcr.io/derselbst/qt6.suse:master
    build:
      context: docker/
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/root/.Xauthority
      - .:/anpv
      - /home:/home:ro
    network_mode: host
